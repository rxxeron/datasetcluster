name: PREP404 Datacenter Cloud Runner

on:
  workflow_dispatch:
    inputs:
      max_books:
        description: 'Maximum books to process in this run'
        required: false
        default: '5'
      auto_chain:
        description: 'Loop continuously by auto-triggering next run (true/false)'
        type: boolean
        required: false
        default: false

permissions:
  actions: write
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sentinel Health Check
        run: |
          python -c "
          from sentinel import sentinel
          sentinel.check_all_nodes()
          snap = sentinel.get_cluster_snapshot()
          print('Cluster Snapshot:', snap)
          "

      - name: Run PREP404 Datacenter Orchestrator
        run: |
          python -c "
          from sentinel import sentinel
          from orchestrator import orchestrator
          import time, sys

          max_books = int('${{ inputs.max_books }}' or 5)
          print(f'Starting run with max_books={max_books}...')
          sentinel.start()
          orchestrator.run_batch(max_books=max_books)
          print('Batch execution completed successfully!')
          "

      - name: Optional Auto-chain Next Run (Only If Explicitly Enabled)
        if: success() && inputs.auto_chain == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, subprocess
          try:
              from cloud_tracker import get_tracker
              tracker = get_tracker()
              cache = tracker.refresh_cache(force=True) if tracker.enabled else {}
              with open('manifest.json') as f:
                  manifest = json.load(f)
              items = manifest.get('items', [])
              pending = [it for it in items if not (tracker.enabled and tracker.is_already_completed(it.get('drive_file_id')))]
              print(f'Pending books remaining: {len(pending)}')
              if len(pending) > 0:
                  print('Auto-triggering next run because auto_chain=true was explicitly set...')
                  subprocess.run(['gh', 'workflow', 'run', 'runner.yml', '-f', 'max_books=${{ inputs.max_books }}', '-f', 'auto_chain=true'], check=True)
              else:
                  print('🎉 ALL 1,496 BOOKS IN CATALOG COMPLETED!')
          except Exception as e:
              print(f'Chain trigger notice: {e}')
          "
