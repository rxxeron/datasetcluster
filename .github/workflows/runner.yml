name: PREP404 Datacenter Cloud Runner

on:
  workflow_dispatch:
    inputs:
      max_books:
        description: 'Maximum books to process in this run'
        required: false
        default: '5'
  schedule:
    # Trigger automatically every 2 hours to process pending books
    - cron: '0 */2 * * *'

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sentinel Health Check
        run: |
          python -c "
          from sentinel import sentinel
          sentinel.check_all_nodes()
          snap = sentinel.get_cluster_snapshot()
          print('Cluster Snapshot:', snap)
          "

      - name: Run PREP404 Datacenter Orchestrator Batch
        run: |
          python -c "
          from sentinel import sentinel
          from orchestrator import orchestrator
          sentinel.start()
          orchestrator.start()
          import time
          # Run for up to 5 hours or until stopped
          for _ in range(180):
              time.sleep(100)
          "
