name: PREP404 Datacenter Cloud Runner

on:
  workflow_dispatch:
    inputs:
      max_books:
        description: 'Maximum books to process in this run'
        required: false
        default: '9999'
  schedule:
    # Run every 2 hours continuously
    - cron: '0 */2 * * *'

permissions:
  actions: write
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sentinel Health Check
        run: |
          python -c "
          from sentinel import sentinel
          sentinel.check_all_nodes()
          snap = sentinel.get_cluster_snapshot()
          print('Cluster Snapshot:', snap)
          "

      - name: Run PREP404 Datacenter Continuous Orchestrator
        run: |
          python -c "
          from sentinel import sentinel
          from orchestrator import orchestrator
          import time
          sentinel.start()
          orchestrator.start()
          # Keep process alive up to 5.5 hours to process maximum books
          for i in range(198):
              time.sleep(100)
          "

      - name: Save Parsed Books to GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep404_parsed_books
          path: parsed_output/
          if-no-files-found: ignore
          retention-days: 90

      - name: Commit and Push Verified book.json to GitHub
        if: always()
        run: |
          git config --global user.name "PREP404 Datacenter Bot"
          git config --global user.email "bot@prep404.com"
          git pull --rebase origin main || true
          if [ -d "parsed_output" ]; then
            git add parsed_output/
            git commit -m "chore: save verified book.json from cloud runner [skip ci]" || true
            git push origin main || true
          fi

      - name: Auto-chain Next Run If Pending Books Remain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, subprocess
          try:
              from cloud_tracker import get_tracker
              tracker = get_tracker()
              cache = tracker.refresh_cache(force=True) if tracker.enabled else {}
              with open('manifest.json') as f:
                  manifest = json.load(f)
              items = manifest.get('items', [])
              pending = [it for it in items if not (tracker.enabled and tracker.is_already_completed(it.get('drive_file_id')))]
              print(f'Pending books remaining: {len(pending)}')
              if len(pending) > 0:
                  print('Auto-triggering next run to keep parsing non-stop...')
                  subprocess.run(['gh', 'workflow', 'run', 'runner.yml', '-f', 'max_books=9999'], check=True)
              else:
                  print('🎉 ALL 1,496 BOOKS IN CATALOG COMPLETED!')
          except Exception as e:
              print(f'Chain trigger notice: {e}')
          "
